; Hackers-Nightlight unified firmware project.
;
; One shared src/+include/ tree builds every supported bulb. Adding a new bulb means
; adding one <NAME>/board.json (pins, LED driver strategy, per-board quirks - <NAME> is
; the bulb's top-level folder, a sibling of this firmware/ directory) and one
; [env:<name>] section below - not a new copy of the whole codebase. Settings shared by
; every bulb (currently just AP credentials) live in this directory's app_config.json.
;
; `pio run -e <name>` regenerates that board's include/generated/board_config.h and
; include/components/WebServer/page_index.h from ../<NAME>/board.json before compiling
; (see boards/generate_board_config.py, wired in via extra_scripts below).
;
; See README.md in this directory for the full add-a-new-bulb walkthrough.

[env]
platform = espressif32
framework = arduino
build_flags =
    -DCONFIG_SCAN_MAX_AP=10
    -DCONFIG_MGMT_AP_MAX_CONNECTIONS=10
    -Wl,-z,muldefs
extra_scripts = pre:boards/generate_board_config.py

[env:vont]
board = lolin_c3_mini

[env:wyze]
board = lolin_c3_mini

[env:orein]
board = lolin_c3_mini

[env:razer]
board = lolin_c3_mini
